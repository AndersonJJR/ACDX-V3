spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 100
          fetch_size: 100
        order_inserts: true
        order_updates: true
        generate_statistics: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  redis:
    host: ${SPRING_REDIS_HOST}
    port: ${SPRING_REDIS_PORT}
    password: ${SPRING_REDIS_PASSWORD}
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 50
        max-idle: 20
        min-idle: 10

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    virtual-host: ${SPRING_RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 10
        max-concurrency: 50
        prefetch: 20
        retry:
          enabled: true
          initial-interval: 5000
          max-attempts: 5
          multiplier: 2

  data:
    mongodb:
      uri: ${SPRING_MONGODB_URI}
      database: inventory_audit

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_ISSUER_URI}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_JWK_SET_URI}

server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

app:
  messaging:
    exchange:
      inventory: inventory.exchange
    routing-key:
      stock-reserved: stock.reserved
      stock-unreserved: stock.unreserved
      goods-received: goods.received
      invoice-matched: invoice.matched
      invoice-mismatch: invoice.mismatch
      valuation-recalculated: valuation.recalculated
      stock-transferred: stock.transferred
    queue:
      reposting: inventory.reposting.trigger
      three-way-match: finance.purchase_invoice.created
      sales-order-confirmed: sales.order.confirmed
      sales-order-cancelled: sales.order.cancelled
      production-order-completed: production.order.completed

  three-way-match:
    qty-tolerance: 0.01
    rate-tolerance: 0.01

  reposting:
    chunk-size: 5000

  inventory:
    default-valuation-method: MOVING_AVERAGE
    allow-negative-stock: false
    reservation-expiry-days: 30
    lock-lease-seconds: 30

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: false

logging:
  level:
    com.erp.brazil.inventory: INFO
    org.springframework.data.jpa: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/inventory-supply-service/application.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB