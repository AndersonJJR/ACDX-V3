server:
  port: 8084

spring:
  application:
    name: inventory-supply-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/erp_inventory?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo
        jdbc.lob.non_contextual_creation: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "Initial schema"
    validate-on-migrate: true

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/erp_inventory}
      auto-index-creation: true

  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:}
    database: ${SPRING_REDIS_DATABASE:0}
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 2

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    virtual-host: ${SPRING_RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 5
        max-concurrency: 20
        prefetch: 10
        retry:
          enabled: true
          initial-interval: 5000
          max-attempts: 3
          max-interval: 60000
          multiplier: 2

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_ISSUER_URI:http://localhost:8080/realms/erp}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_JWK_SET_URI:http://localhost:8080/realms/erp/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.erp.brazil.inventory: DEBUG
    org.springframework.data.jpa: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  rabbitmq:
    exchange:
      inventory: inventory.exchange
    queue:
      reposting: inventory.reposting.queue
      three-way-match: inventory.three-way-match.queue
      sales-order-confirmed: inventory.sales-order-confirmed.queue
      sales-order-cancelled: inventory.sales-order-cancelled.queue
      production-order-completed: inventory.production-order-completed.queue
    routing-key:
      invoice-matched: invoice.matched
      invoice-mismatch: invoice.mismatch

  inventory:
    distributed-lock:
      lease-time-seconds: 30
      wait-time-seconds: 10
    reposting:
      chunk-size: 1000
      max-concurrent-jobs: 3
    valuation:
      default-method: MOVING_AVERAGE
      fifo-layers-max: 1000
    stock:
      allow-negative-default: false
      auto-create-batch: true
      auto-create-serial: true