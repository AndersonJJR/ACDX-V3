spring:
  application:
    name: inventory-supply-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/inventory_db}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 50
          fetch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 0
    baseline-description: "Initial schema"
    out-of-order: false
    validate-on-migrate: true

  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:}
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 5
        max-concurrency: 20
        prefetch: 10
        retry:
          enabled: true
          initial-interval: 2000
          max-attempts: 3
          multiplier: 2

  data:
    mongodb:
      uri: ${SPRING_MONGODB_URI:mongodb://localhost:27017/inventory_audit}
      database: inventory_audit

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_ISSUER_URI:http://localhost:8080/realms/erp}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_JWK_SET_URI:http://localhost:8080/realms/erp/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway,loggers
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

app:
  messaging:
    exchange:
      inventory: inventory.exchange
    routing-key:
      stock-reserved: stock.reserved
      stock-unreserved: stock.unreserved
      goods-received: goods.received
      invoice-matched: invoice.matched
      invoice-mismatch: invoice.mismatch
      valuation-recalculated: valuation.recalculated
      stock-transferred: stock.transferred
    queue:
      reposting: inventory.reposting.trigger
      three-way-match: finance.purchase_invoice.created
      sales-order-confirmed: sales.order.confirmed
      sales-order-cancelled: sales.order.cancelled
      production-order-completed: production.order.completed

  three-way-match:
    qty-tolerance: 0.01
    rate-tolerance: 0.01

  reposting:
    chunk-size: 1000

  inventory:
    default-valuation-method: MOVING_AVERAGE
    allow-negative-stock: false
    reservation-expiry-days: 30
    lock-lease-seconds: 30

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.erp.brazil.inventory: DEBUG
    org.springframework.data.jpa: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"