# ERP Common Core - Base Configuration
# This file contains shared configuration for all services

app:
  # JWT Configuration
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-min-256-bits-change-this-secret-in-production}
    access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY:3600}
    refresh-token-validity-seconds: ${JWT_REFRESH_TOKEN_VALIDITY:604800}
    issuer: ${JWT_ISSUER:erp-brazil}

  # Event Publishing Configuration
  events:
    exchange: ${EVENTS_EXCHANGE:erp.events}
    routing-key-prefix: ${EVENTS_ROUTING_KEY_PREFIX:erp}

  # Outbox Configuration
  outbox:
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL:5000}

  # OpenAPI Configuration
  openapi:
    title: ${OPENAPI_TITLE:ERP Brazil API}
    version: ${OPENAPI_VERSION:1.0.0}
    description: ${OPENAPI_DESCRIPTION:ERP Brazil Microservices API}
    dev-url: ${OPENAPI_DEV_URL:http://localhost:8080}
    prod-url: ${OPENAPI_PROD_URL:https://api.erp.brazil.com}

  # Distributed Lock Configuration
  lock:
    default-wait-time: ${LOCK_DEFAULT_WAIT_TIME:10}
    default-lease-time: ${LOCK_DEFAULT_LEASE_TIME:30}

# Spring Configuration
spring:
  application:
    name: erp-common-core

  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-durations-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
    default-property-inclusion: non_null

  # JPA Configuration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: UTC
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
        batch_versioned_data: true

  # Transaction Configuration
  transaction:
    default-timeout: 30

# Server Configuration (for standalone testing)
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
    jmx:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
    rabbit:
      enabled: true
    mongo:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# Logging Configuration
logging:
  level:
    com.erp.brazil.common: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/erp-common-core.log

# Validation Messages
spring:
  messages:
    basename: messages/validation
    encoding: UTF-8