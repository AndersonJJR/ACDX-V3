spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:sqlite:finance-dev.db
    driver-class-name: org.sqlite.JDBC
    username: sa
    password:
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLiteDialect

  flyway:
    enabled: false

  quartz:
    job-store-type: memory
    jdbc:
      initialize-schema: never

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto

logging:
  level:
    com.erp.brazil.finance: DEBUG
    org.springframework.amqp: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE