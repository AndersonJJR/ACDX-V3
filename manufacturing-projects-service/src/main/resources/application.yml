spring:
  application:
    name: manufacturing-projects-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: UTC
        generate_statistics: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "Initial baseline"
    locations: classpath:db/migration
    sql-migration-prefix: V
    sql-migration-suffixes: .sql
    out-of-order: true

  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN:5}
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 60000

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: ${RABBITMQ_CONCURRENCY:3}
        max-concurrency: ${RABBITMQ_MAX_CONCURRENCY:10}
        prefetch: ${RABBITMQ_PREFETCH:10}
        retry:
          enabled: true
          initial-interval: 2000
          max-interval: 10000
          multiplier: 2

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/manufacturing}
      auto-index-creation: true

  cache:
    type: redis
    redis:
      time-to-live: 300000

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/erp}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8080/realms/erp/protocol/openid-connect/certs}

  web:
    mvc:
      pathmatch:
        matching-strategy: ant_path_matcher

server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.erp.brazil.manufacturing: ${LOG_LEVEL:INFO}
    org.springframework.web: ${LOG_LEVEL_WEB:WARN}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_BINDER:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

app:
  rabbitmq:
    exchange: manufacturing.events
    queue:
      sales-order-confirmed: manufacturing.sales-order-confirmed
      sales-order-cancelled: manufacturing.sales-order-cancelled
      goods-received: manufacturing.goods-received
      material-reserved: manufacturing.material-reserved
      material-released: manufacturing.material-released

  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
    finite-capacity: ${SCHEDULING_FINITE:true}
    horizon-days: ${SCHEDULING_HORIZON_DAYS:30}

  quality:
    default-aql: 1.0
    inspection-timeout-hours: 24

  subcontracting:
    auto-create-inspection: true
    default-lead-time-days: 7

  projects:
    default-currency: BRL
    timesheet-approval-required: true

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:sqlite:${DEV_DB_PATH:./dev.db}
    driver-class-name: org.sqlite.JDBC
    username: sa
    password:
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true

  flyway:
    enabled: false

  rabbitmq:
    host: localhost
    port: 5672

  data:
    mongodb:
      uri: mongodb://localhost:27017/manufacturing_dev

  cache:
    type: simple

logging:
  level:
    com.erp.brazil.manufacturing: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG