      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-erp_brazil}?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-erp_user}
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/mysql_password
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USER_FILE:-/run/secrets/mongo_root_user}:${MONGO_ROOT_PASSWORD_FILE:-/run/secrets/mongo_root_password}@mongodb:27017/${MONGO_DATABASE:-erp_brazil}?authSource=admin
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME_FILE: /run/secrets/rabbitmq_user
      SPRING_RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      CERTIFICADO_A1_PATH: ${CERTIFICADO_A1_PATH:-/certs/certificado.pfx}
      CERTIFICADO_A1_PASSWORD_FILE: /run/secrets/certificado_a1_password
      SEFAZ_ENVIRONMENT: ${SEFAZ_ENVIRONMENT:-producao}
    volumes:
      - ./certs:/certs:ro
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - erp-network-prod
    deploy:
      resources:
        limits:
          memory: 2G
