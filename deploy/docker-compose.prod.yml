      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USER_FILE:-/run/secrets/mongo_root_user}:${MONGO_ROOT_PASSWORD_FILE:-/run/secrets/mongo_root_password}@mongodb:27017/${MONGO_DATABASE:-erp_brazil}?authSource=admin
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME_FILE: /run/secrets/rabbitmq_user
      SPRING_RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME_FILE: /run/secrets/mail_username
      MAIL_PASSWORD_FILE: /run/secrets/mail_password
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - erp-network-prod
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
    restart: unless-stopped

  inventory-supply-service:
    build:
      context: ../inventory-supply-service
      dockerfile: Dockerfile.prod
    container_name: erp-inventory-supply-service-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: ${INVENTORY_PORT:-8085}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-erp_brazil}?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-erp_user}
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/mysql_password
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USER_FILE:-/run/secrets/mongo_root_user}:${MONGO_ROOT_PASSWORD_FILE:-/run/secrets/mongo_root_password}@mongodb:27017/${MONGO_DATABASE:-erp_brazil}?authSource=admin
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME_FILE: /run/secrets/rabbitmq_user
      SPRING_RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - erp-network-prod
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
    restart: unless-stopped

  manufacturing-projects-service:
    build:
      context: ../manufacturing-projects-service
      dockerfile: Dockerfile.prod
    container_name: erp-manufacturing-projects-service-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: ${MANUFACTURING_PORT:-8086}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-erp_brazil}?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-erp_user}
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/mysql_password
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USER_FILE:-/run/secrets/mongo_root_user}:${MONGO_ROOT_PASSWORD_FILE:-/run/secrets/mongo_root_password}@mongodb:27017/${MONGO_DATABASE:-erp_brazil}?authSource=admin
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME_FILE: /run/secrets/rabbitmq_user
      SPRING_RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - erp-network-prod
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
      replicas: 2
      restart_policy:
