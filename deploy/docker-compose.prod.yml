  # ===========================================
  # FRONTEND (Production - Nginx)
  # ===========================================

  erp-frontend:
    build:
      context: ../erp-frontend-web
      dockerfile: Dockerfile.prod
    container_name: erp-frontend-prod
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    depends_on:
      - api-gateway
    networks:
      - erp-network-prod
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.1'
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    restart: unless-stopped

networks:
  erp-network-prod:
    driver: bridge
    internal: false

volumes:
  mysql_data:
  mongo_data:
  redis_data:
  rabbitmq_data:

secrets:
  mysql_root_password:
    external: true
  mysql_password:
    external: true
  mongo_root_user:
    external: true
  mongo_root_password:
    external: true
  redis_password:
    external: true
  rabbitmq_user:
    external: true
  rabbitmq_password:
    external: true
  jwt_secret:
    external: true
  certificado_a1_password:
    external: true
  mail_username:
    external: true
  mail_password:
    external: true