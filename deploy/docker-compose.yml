version: '3.9'

# ERP Brazil - Development Infrastructure
# Run with: docker-compose -f deploy/docker-compose.yml up -d

services:
  # ============================================
  # MySQL 8.4 Database
  # ============================================
  mysql:
    image: mysql:8.4
    container_name: erp-mysql-dev
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-erp_dev}
      MYSQL_USER: ${MYSQL_USER:-erp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-erp_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./mysql/conf.d:/etc/mysql/conf.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max-connections=200
      - --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - erp-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ============================================
  # MongoDB 7.0
  # ============================================
  mongodb:
    image: mongo:7.0
    container_name: erp-mongodb-dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-adminpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-erp_dev}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongodb/init:/docker-entrypoint-initdb.d
    command:
      - --wiredTigerCacheSizeGB=1
      - --maxConns=200
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - erp-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ============================================
  # Redis 7
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: erp-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --maxmemory 256mb
      - --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - erp-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ============================================
  # RabbitMQ 3.13
  # ============================================
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: erp-rabbitmq-dev
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-erp_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-erp_password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/erp}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - erp-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ============================================
  # pgAdmin 4 (for PostgreSQL if needed)
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: erp-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@erp.brazil.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-adminpassword}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - erp-network
    profiles:
      - tools
    deploy:
      resources:
        limits:
          memory: 256M

  # ============================================
  # Mongo Express (MongoDB Web UI)
  # ============================================
  mongo-express:
    image: mongo-express:1.0
    container_name: erp-mongo-express-dev
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-adminpassword}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-adminpassword}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-adminpassword}
      ME_CONFIG_OPTIONS_EDITORTHEME: "dracula"
    ports:
      - "8081:8081"
    networks:
      - erp-network
    profiles:
      - tools
    deploy:
      resources:
        limits:
          memory: 128M

  # ============================================
  # Redis Commander (Redis Web UI)
  # ============================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: erp-redis-commander-dev
    environment:
      REDIS_HOSTS: local:redis:6379
      HTTP_USER: ${REDIS_CMD_USER:-admin}
      HTTP_PASSWORD: ${REDIS_CMD_PASSWORD:-adminpassword}
    ports:
      - "8082:8081"
    networks:
      - erp-network
    profiles:
      - tools
    deploy:
      resources:
        limits:
          memory: 128M

  # ============================================
  # RabbitMQ Management (already included in rabbitmq:management image)
  # Access at http://localhost:15672
  # ============================================

networks:
  erp-network:
    driver: bridge
    name: erp-network-dev

volumes:
  mysql_data:
    name: erp-mysql-dev-data
  mongodb_data:
    name: erp-mongodb-dev-data
  redis_data:
    name: erp-redis-dev-data
  rabbitmq_data:
    name: erp-rabbitmq-dev-data
  pgadmin_data:
    name: erp-pgadmin-dev-data