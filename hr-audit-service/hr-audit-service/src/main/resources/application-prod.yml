spring:
  # MySQL for production
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:erp_hr_audit}?useSSL=true&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
          fetch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false

  # MongoDB for production
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: false

  # Redis for production
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 2

  # RabbitMQ for production
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 10
        max-concurrency: 50
        prefetch: 20

  # Mail for production
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Server with SSL
server:
  port: ${SERVER_PORT:8443}
  ssl:
    enabled: true
    key-store: ${SSL_KEY_STORE:classpath:keystore.p12}
    key-store-password: ${SSL_KEY_STORE_PASSWORD}
    key-store-type: PKCS12
    key-alias: ${SSL_KEY_ALIAS:hr-audit-service}
  http2:
    enabled: true

# Actuator with security
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
    jmx:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# Logging for production
logging:
  level:
    com.erp.brazil.hr: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/hr-audit-service/hr-audit-service.log
    max-size: 500MB
    max-history: 90

# Production specific
app:
  mongodb:
    audit:
      collection:
        size: ${MONGODB_AUDIT_COLLECTION_SIZE:1073741824}
        max-docs: ${MONGODB_AUDIT_MAX_DOCS:10000000}
      ttl:
        days: ${MONGODB_AUDIT_TTL_DAYS:2555}

  webhook:
    timeout:
      seconds: ${WEBHOOK_TIMEOUT_SECONDS:30}

  whatsapp:
    api:
      url: ${WHATSAPP_API_URL}
      token: ${WHATSAPP_API_TOKEN}

  payslip:
    output-dir: ${PAYSLIP_OUTPUT_DIR:/var/lib/hr-audit-service/payslips}
    digital-signature:
      enabled: ${PAYSLIP_DIGITAL_SIGNATURE_ENABLED:false}
      keystore-path: ${PAYSLIP_KEYSTORE_PATH:}
      keystore-password: ${PAYSLIP_KEYSTORE_PASSWORD:}
      key-alias: ${PAYSLIP_KEY_ALIAS:}
      key-password: ${PAYSLIP_KEY_PASSWORD:}

  lgpd:
    cpft-masking-enabled: true
    audit-ttl-years: 7

  openapi:
    server-url: ${OPENAPI_SERVER_URL:https://api.empresa.com.br/api}