# Production Profile Configuration
# Uses MySQL + MongoDB + Redis + RabbitMQ

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://mysql:3306/hr_audit?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
    username: ${DATABASE_USERNAME:hr_audit}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 60000
      pool-name: HRAuditHikariPool
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        use_sql_comments: false
        jdbc:
          time_zone: UTC
        generate_statistics: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
    locations: classpath:db/migration
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://mongodb:27017/hr_audit?authSource=admin}
      auto-index-creation: false
      auto-create-indexes: false
      database: hr_audit
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      ssl: ${REDIS_SSL:false}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
        shutdown-timeout: 2000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 10000
    requested-heartbeat: 30
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        concurrency: 10
        max-concurrency: 50
        prefetch: 20
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2000
          max-interval: 30000
          multiplier: 2
          max-attempts: 5
  mail:
    host: ${MAIL_HOST:smtp.sendgrid.net}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:apikey}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org:
        quartz:
          scheduler:
            instanceName: HRScheduler
            instanceId: AUTO
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: 20
            threadPriority: 5
          jobStore:
            class: org.quartz.impl.jdbcjobstore.JobStoreTX
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            tablePrefix: QRTZ_
            isClustered: true
            clusterCheckinInterval: 15000
            useProperties: false
            misfireThreshold: 60000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,scheduledtasks,flyway,quartz
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: production
  info:
    env:
      enabled: true

logging:
  level:
    com.erp.brazil.hr: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.flywaydb: INFO
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/hr-audit-service/hr-audit-service.log
    max-size: 500MB
    max-history: 90
    total-size-cap: 10GB

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration: 3600000
      refresh-expiration: 2592000000
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.empresa.com.br}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: Authorization,Content-Type,X-Requested-With
      allow-credentials: true
      max-age: 3600
  audit:
    mongodb:
      collection: audit_logs
      capped-size: 1048576000
      max-documents: 10000000
      ttl-days: 2555
    masking:
      enabled: true
      fields: cpf,rg,email,phone,bank_account,pix_key,address,mother_name,father_name
  notifications:
    queue:
      redis-key: "hr:notifications:queue"
      batch-size: 500
      processing-interval: 2000
    email:
      from: ${NOTIFICATION_EMAIL_FROM:rh@empresa.com.br}
      reply-to: ${NOTIFICATION_EMAIL_REPLY_TO:rh@empresa.com.br}
    whatsapp:
      api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v18.0}
      api-token: ${WHATSAPP_API_TOKEN:}
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  webhook:
    outbox:
      enabled: true
      poll-interval: 3000
      batch-size: 100
    retry:
      max-attempts: 7
      initial-delay: 5000
      max-delay: 300000
      multiplier: 2
    dead-letter:
      enabled: true
      queue-name: "hr:webhooks:dlq"
      max-retention-days: 30
  payroll:
    inss:
      brackets:
        - limit: 1412.00
          rate: 7.5
        - limit: 2666.68
          rate: 9.0
        - limit: 4000.03
          rate: 12.0
        - limit: 7786.02
          rate: 14.0
      ceiling: 7786.02
      max-contribution: 908.86
    irrf:
      brackets:
        - limit: 2259.20
          rate: 0.0
          deduction: 0.00
        - limit: 2826.65
          rate: 7.5
          deduction: 169.44
        - limit: 3751.05
          rate: 15.0
          deduction: 381.44
        - limit: 4664.68
          rate: 22.5
          deduction: 662.77
        - limit: 999999999.00
          rate: 27.5
          deduction: 896.00
      dependent-deduction: 189.59
    fgts:
      rate: 8.0
      deposit-day: 7
  ponto:
    tolerance-minutes: 10
    max-overtime-hours-day: 2
    max-overtime-hours-month: 40
    night-shift-start: "22:00"
    night-shift-end: "05:00"
    night-shift-additional: 20.0
  lgpd:
    dsar:
      response-days: 15
      verification-required: true
    erasure:
      retention-years: 5
      exceptions:
        - payroll
        - fiscal
        - legal
  pdf:
    payslip:
      template-path: "templates/payslip"
      watermark: "CONFIDENCIAL"
      digital-signature:
        enabled: true
        keystore-path: ${PDF_KEYSTORE_PATH:/etc/ssl/keystore.p12}
        keystore-password: ${PDF_KEYSTORE_PASSWORD:}
        alias: ${PDF_KEYSTORE_ALIAS:hr-audit}