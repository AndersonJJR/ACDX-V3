spring.application.name=hr-audit-service

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/erp_hr_audit}
spring.data.mongodb.auto-index-creation=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.concurrency=5
spring.rabbitmq.listener.simple.max-concurrency=20
spring.rabbitmq.listener.simple.prefetch=10

# Mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Quartz
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.properties.org.quartz.scheduler.instanceName=HRScheduler
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.threadPool.class=org.quartz.simpl.SimpleThreadPool
spring.quartz.properties.org.quartz.threadPool.threadCount=10
spring.quartz.properties.org.quartz.threadPool.threadPriority=5
spring.quartz.properties.org.quartz.jobStore.class=org.quartz.impl.jdbcjobstore.JobStoreTX
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.StdJDBCDelegate
spring.quartz.properties.org.quartz.jobStore.tablePrefix=QRTZ_
spring.quartz.properties.org.quartz.jobStore.isClustered=true
spring.quartz.properties.org.quartz.jobStore.clusterCheckinInterval=15000
spring.quartz.properties.org.quartz.jobStore.useProperties=false

# Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH2_JWK_SET_URI:}

# Server
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.error.include-message=always
server.error.include-binding-errors=always

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers,scheduledtasks,flyway,quartz
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# Logging
logging.level.com.erp.brazil.hr=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/hr-audit-service.log
logging.file.max-size=100MB
logging.file.max-history=30

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.packages-to-scan=com.erp.brazil.hr.presentation.rest

# Application specific
app.mongodb.audit.collection.size=${MONGODB_AUDIT_COLLECTION_SIZE:1073741824}
app.mongodb.audit.collection.max-docs=${MONGODB_AUDIT_MAX_DOCS:10000000}
app.mongodb.audit.ttl.days=${MONGODB_AUDIT_TTL_DAYS:2555}

app.webhook.timeout.seconds=${WEBHOOK_TIMEOUT_SECONDS:30}

app.whatsapp.api.url=${WHATSAPP_API_URL:https://api.zenvia.com/v2}
app.whatsapp.api.token=${WHATSAPP_API_TOKEN:}

app.payslip.output-dir=${PAYSLIP_OUTPUT_DIR:/tmp/payslips}
app.payslip.digital-signature.enabled=${PAYSLIP_DIGITAL_SIGNATURE_ENABLED:false}
app.payslip.digital-signature.keystore-path=${PAYSLIP_KEYSTORE_PATH:}
app.payslip.digital-signature.keystore-password=${PAYSLIP_KEYSTORE_PASSWORD:}
app.payslip.digital-signature.key-alias=${PAYSLIP_KEY_ALIAS:}
app.payslip.digital-signature.key-password=${PAYSLIP_KEY_PASSWORD:}

app.lgpd.cpft-masking-enabled=true
app.lgpd.audit-ttl-years=7

app.audit.masking.enabled=true
app.audit.masking.fields=cpf,rg,email,phone,bank_account,pix_key,address,mother_name,father_name

app.openapi.server-url=${OPENAPI_SERVER_URL:http://localhost:8080/api}
app.openapi.title=HR Audit Service API
app.openapi.version=1.0.0
app.openapi.description=ERP Brazil - HR, Audit & Notifications Service

app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration=86400000
app.security.jwt.refresh-expiration=604800000
app.security.cors.allowed-origins=http://localhost:3000
app.security.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.security.cors.allowed-headers=*
app.security.cors.allow-credentials=true

app.notifications.email.from=rh@empresa.com.br
app.notifications.email.reply-to=rh@empresa.com.br

app.notifications.whatsapp.api-url=https://graph.facebook.com/v18.0
app.notifications.whatsapp.api-token=${WHATSAPP_API_TOKEN:}
app.notifications.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}

app.pdf.payslip.watermark=CONFIDENCIAL
app.pdf.payslip.digital-signature.enabled=${PAYSLIP_DIGITAL_SIGNATURE_ENABLED:false}