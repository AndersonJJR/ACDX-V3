# Development Profile Configuration
# Uses SQLite for easy local development

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:sqlite:hr-audit-dev.db
    driver-class-name: org.sqlite.JDBC
    username: ""
    password: ""
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLiteDialect
  flyway:
    enabled: false
  data:
    mongodb:
      uri: mongodb://localhost:27017/hr_audit_dev
      auto-index-creation: true
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  quartz:
    job-store-type: memory

logging:
  level:
    com.erp.brazil.hr: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: DEBUG
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"

app:
  audit:
    mongodb:
      collection: audit_logs_dev
      capped-size: 10485760
      max-documents: 100000
      ttl-days: 30
  notifications:
    queue:
      redis-key: "hr:notifications:queue:dev"
  webhook:
    outbox:
      enabled: true
    dead-letter:
      queue-name: "hr:webhooks:dlq:dev"