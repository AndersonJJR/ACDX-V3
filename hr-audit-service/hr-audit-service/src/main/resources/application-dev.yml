spring:
  # SQLite for development
  datasource:
    url: jdbc:sqlite:./hr-audit-dev.db
    driver-class-name: org.sqlite.JDBC
    username: sa
    password:
    hikari:
      maximum-pool-size: 5

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Embedded MongoDB for dev (or use Testcontainers)
  data:
    mongodb:
      uri: mongodb://localhost:27017/erp_hr_audit_dev

  # Embedded Redis for dev
  redis:
    host: localhost
    port: 6379

  # Embedded RabbitMQ for dev
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # Mail for dev (use mock or local SMTP like Mailhog)
  mail:
    host: localhost
    port: 1025
    username: dev@erp-brazil.local
    password: dev

# Disable SSL for dev
server:
  ssl:
    enabled: false

# Logging
logging:
  level:
    com.erp.brazil.hr: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Dev-specific
app:
  mongodb:
    audit:
      collection:
        size: 104857600  # 100MB for dev
        max-docs: 100000
      ttl:
        days: 30  # 30 days for dev

  payslip:
    output-dir: ./payslips-dev
    digital-signature:
      enabled: false

  openapi:
    server-url: http://localhost:8080/api