spring:
  application:
    name: hr-audit-service-test

  # H2 Database for testing
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 5

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Embedded MongoDB for testing (or use Testcontainers)
  data:
    mongodb:
      uri: mongodb://localhost:27017/erp_hr_audit_test

  # Embedded Redis for testing
  redis:
    host: localhost
    port: 6379

  # Embedded RabbitMQ for testing
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # Mail for testing
  mail:
    host: localhost
    port: 1025

  # Quartz
  quartz:
    job-store-type: memory

  # Security
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: 
          jwk-set-uri: 

# Server
server:
  port: 0  # Random port for tests
  servlet:
    context-path: /api

# Disable Flyway for tests
flyway:
  enabled: false

# Logging
logging:
  level:
    com.erp.brazil.hr: DEBUG
    org.springframework: WARN
    org.hibernate: WARN

# Test specific
app:
  mongodb:
    audit:
      collection:
        size: 10485760  # 10MB for test
        max-docs: 1000
      ttl:
        days: 1  # 1 day for test

  payslip:
    output-dir: ./target/test-payslips
    digital-signature:
      enabled: false

  lgpd:
    cpft-masking-enabled: true
    audit-ttl-years: 0

  audit:
    masking:
      enabled: true

  openapi:
    server-url: http://localhost:8080/api