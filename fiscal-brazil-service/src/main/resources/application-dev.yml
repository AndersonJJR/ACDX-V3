spring:
  # H2 Database for development
  datasource:
    url: jdbc:h2:mem:fiscal_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10

  # H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA for H2
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Flyway for H2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis disabled for dev (use simple cache)
  cache:
    type: simple

  # MongoDB embedded for dev
  data:
    mongodb:
      host: localhost
      port: 27017
      database: fiscal_brazil_dev
      auto-index-creation: true

  # RabbitMQ for dev (use embedded or local)
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# Server
server:
  port: 8081

# Logging - more verbose for dev
logging:
  level:
    com.erp.brazil.fiscal: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Fiscal properties for dev
fiscal:
  sefaz:
    default-environment: homologation
  certificado:
    default-renewal-alert-days: 30
  sped:
    output-directory: ./tmp/sped
  leis:
    sync:
      enabled: false
  messaging:
    exchange: fiscal.events.dev

# Resilience4j - disabled for dev
resilience4j:
  circuitbreaker:
    instances:
      sefaz:
        registerHealthIndicator: false
  retry:
    instances:
      sefaz:
        maxAttempts: 1

# Async executors - smaller for dev
spring:
  task:
    execution:
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 50
    scheduling:
      pool:
        size: 2