spring:
  # MySQL Database for production
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:fiscal_brazil}?useSSL=true&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:fiscal_user}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: ${MYSQL_POOL_MAX:20}
      minimum-idle: ${MYSQL_POOL_MIN:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # JPA for MySQL
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false

  # Flyway for production
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

  # Redis for production
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 5000ms
      ssl:
        enabled: ${REDIS_SSL:false}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
        shutdown-timeout: 100ms

  # MongoDB for production
  data:
    mongodb:
      host: ${MONGO_HOST:localhost}
      port: ${MONGO_PORT:27017}
      database: ${MONGO_DB:fiscal_brazil}
      username: ${MONGO_USER:fiscal_user}
      password: ${MONGO_PASSWORD:}
      authentication-database: admin
      auto-index-creation: false
      connect-timeout: 10000
      socket-timeout: 30000

  # RabbitMQ for production
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:fiscal_user}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:fiscal}
    connection-timeout: 10000
    requested-heartbeat: 60
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: true
        initial-interval: 2000
        max-interval: 30000
        multiplier: 2

  # Quartz for production clustering
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceName: FiscalScheduler
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.threadPool.threadCount: 20
      org.quartz.jobStore.class: org.quartz.impl.jdbcjobstore.JobStoreTX
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 15000
      org.quartz.jobStore.maxMisfiresToHandleAtATime: 20
      org.quartz.jobStore.misfireThreshold: 60000

# Server
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
  error:
    include-message: never
    include-binding-errors: never
  tomcat:
    max-threads: 200
    min-spare-threads: 10
    accept-count: 100
    connection-timeout: 20000
    max-connections: 10000

# Actuator for production
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: production

# OpenAPI - disabled in production or secured
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Logging for production
logging:
  level:
    com.erp.brazil.fiscal: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/fiscal-brazil-service/application.log
    max-size: 500MB
    max-history: 60
    total-size-cap: 10GB

# Fiscal properties for production
fiscal:
  sefaz:
    default-environment: production
    timeout-connect: 30000
    timeout-read: 60000
    max-retries: 3
  certificado:
    master-encryption-key: ${MASTER_ENCRYPTION_KEY:}
    default-renewal-alert-days: 30
  sped:
    output-directory: ${SPED_OUTPUT_DIR:/var/sped/output}
    encoding: ISO-8859-1
  leis:
    sync:
      ncm-url: https://raw.githubusercontent.com/ctresb/leis/main/ncm.csv
      cest-url: https://raw.githubusercontent.com/ctresb/leis/main/cest.csv
      cfop-url: https://raw.githubusercontent.com/ctresb/leis/main/cfop.csv
      tax-rules-url: https://raw.githubusercontent.com/ctresb/leis/main/tax-rules.csv
      enabled: true
  messaging:
    exchange: fiscal.events
    routing-key:
      prefix: fiscal
    queue:
      invoice-created: fiscal.invoice.created
      nfe-cancel-request: fiscal.nfe.cancel.request
      sped-generate-request: fiscal.sped.generate.request

# Resilience4j for production
resilience4j:
  circuitbreaker:
    instances:
      sefaz:
        registerHealthIndicator: true
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60000
        failureRateThreshold: 50
        eventConsumerBufferSize: 20
  retry:
    instances:
      sefaz:
        maxAttempts: 3
        waitDuration: 5000
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - org.springframework.web.client.RestClientException
          - java.util.concurrent.TimeoutException

# Async executors for production
spring:
  task:
    execution:
      pool:
        core-size: 20
        max-size: 100
        queue-capacity: 500
      thread-name-prefix: fiscal-async-
    scheduling:
      pool:
        size: 10
      thread-name-prefix: fiscal-sched-

# Security (placeholder - configure as needed)
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:}