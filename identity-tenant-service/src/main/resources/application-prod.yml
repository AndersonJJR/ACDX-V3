# Identity & Tenant Service - Production Configuration

spring:
  profiles:
    active: prod

  # MySQL Database for production
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://mysql:3306/identity_prod?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:erp_user}
    password: ${MYSQL_PASSWORD:erp_password}
    hikari:
      maximum-pool-size: ${MYSQL_MAX_POOL_SIZE:20}
      minimum-idle: ${MYSQL_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  # JPA with MySQL dialect
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
          fetch_size: 100

  # MongoDB for production
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://mongo:27017/identity_prod?authSource=admin}
      auto-index-creation: false
      database: identity_prod

  # Redis for production
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      ssl: ${REDIS_SSL:false}
      lettuce:
        pool:
          max-active: ${REDIS_MAX_ACTIVE:20}
          max-idle: ${REDIS_MAX_IDLE:10}
          min-idle: ${REDIS_MIN_IDLE:5}
        shutdown-timeout: 2000ms

  # RabbitMQ for production
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:erp_user}
    password: ${RABBITMQ_PASSWORD:erp_password}
    virtual-host: ${RABBITMQ_VHOST:/erp}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: ${RABBITMQ_CONCURRENCY:5}
        max-concurrency: ${RABBITMQ_MAX_CONCURRENCY:20}
        prefetch: ${RABBITMQ_PREFETCH:20}
        retry:
          enabled: true
          initial-interval: 2000
          max-interval: 30000
          multiplier: 2

  # Flyway for production migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false

# Server Configuration
server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  forward-headers-strategy: framework

# Actuator for production
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,quartz
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
    rabbit:
      enabled: true
    mongo:
      enabled: true
    diskspace:
      enabled: true
      threshold: 10MB
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: production
      version: ${app.version:1.0.0}
  tracing:
    sampling:
      probability: 0.1

# Logging for production
logging:
  level:
    com.erp.brazil.identity: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/erp/identity-tenant-service.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB

# Security for production
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:https://auth.erp.brazil.com/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER_URI:https://auth.erp.brazil.com}

# Resilience4j for production
resilience4j:
  circuitbreaker:
    instances:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
  timelimiter:
    instances:
      default:
        timeoutDuration: 10s
  retry:
    instances:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2