spring:
  application:
    name: sales-crm-service
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        show_sql: false
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/sales_crm}
      auto-index-creation: true
  cache:
    type: redis
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 2000ms
  mvc:
    async:
      request-timeout: 30s

server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

fiscal:
  service:
    url: ${FISCAL_SERVICE_URL:http://localhost:8083}

rabbitmq:
  exchange:
    sales: ${RABBITMQ_EXCHANGE:amq.topic}
  queue:
    stock-reserved: ${RABBITMQ_QUEUE_STOCK_RESERVED:sales.stock.reserved}
    stock-unreserved: ${RABBITMQ_QUEUE_STOCK_UNRESERVED:sales.stock.unreserved}
    nfe-emitted: ${RABBITMQ_QUEUE_NFE_EMITTED:sales.nfe.emitted}

commission:
  schedule:
    cron: ${COMMISSION_SCHEDULE_CRON:0 0 2 1 * ?}

logging:
  level:
    com.erp.brazil.sales: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/sales-crm-service.log
    max-size: 100MB
    max-history: 30

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true