spring:
  datasource:
    url: jdbc:sqlite:sales_crm_dev.db
    driver-class-name: org.sqlite.JDBC
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLiteDialect
        format_sql: true
        show_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  data:
    mongodb:
      uri: mongodb://localhost:27017/sales_crm_dev
  redis:
    host: localhost
    port: 6379

server:
  port: 8082

fiscal:
  service:
    url: http://localhost:8083

logging:
  level:
    com.erp.brazil.sales: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE