<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    <div>
      <div class="mx-auto h-12 w-12 bg-primary-600 rounded-xl flex items-center justify-center">
        <svg class="h-8 w-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 16l4-16m-4 16l-4-16m4 16l-4-16"/>
        </svg>
      </div>
      <h2 class="mt-6 text-center text-3xl font-bold text-gray-900">ERP Brazil</h2>
      <p class="mt-2 text-center text-sm text-gray-600">Recupere sua senha</p>
    </div>

    <form class="mt-8 space-y-6" [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
      @if (errorMessage()) {
        <div class="bg-danger-50 border border-danger-200 text-danger-700 px-4 py-3 rounded-lg text-sm" role="alert">
          {{ errorMessage() }}
        </div>
      }

      @if (successMessage()) {
        <div class="bg-success-50 border border-success-200 text-success-700 px-4 py-3 rounded-lg text-sm" role="alert">
          {{ successMessage() }}
        </div>
      }

      <div class="rounded-lg shadow-sm -space-y-px">
        <div>
          <label for="email" class="sr-only">E-mail</label>
          <input
            id="email"
            formControlName="email"
            type="email"
            autocomplete="email"
            placeholder="Seu e-mail"
            class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-primary-500 focus:border-primary-500 focus:z-10 sm:text-sm"
            [class.border-danger-500]="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched"
          >
          @if (forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched) {
            <p class="mt-1 text-sm text-danger-600">E-mail válido é obrigatório</p>
          }
        </div>
      </div>

      <div>
        <app-btn
          type="submit"
          variant="primary"
          fullWidth
          [loading]="isLoading()"
        >
          Enviar link de recuperação
        </app-btn>
      </div>
    </form>

    <div class="text-center text-sm text-gray-500">
      <button type="button" (click)="goBackToLogin()" class="font-medium text-primary-600 hover:text-primary-500">
        ← Voltar ao login
      </button>
    </div>
  </div>
</div>
