<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <app-card class="w-full max-w-2xl p-8 text-center">
    <div class="mx-auto w-16 h-16 bg-primary-100 dark:bg-primary-900/30 rounded-full flex items-center justify-center mb-4">
      <svg class="w-8 h-8 text-primary-600 dark:text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="icon()" />
      </svg>
    </div>
    <h2 class="text-2xl font-bold text-gray-900 dark:text-gray-100 mb-2">{{ title() }}</h2>
    <p class="text-gray-600 dark:text-gray-400 mb-6">{{ description() }}</p>
    <app-btn variant="primary" [routerLink]="actionRoute()">
      {{ actionLabel() }}
    </app-btn>
  </app-card>
</div>
