<div class="mb-6">
  <!-- Breadcrumb -->
  @if (showBreadcrumb() && breadcrumbs().length > 0) {
    <app-breadcrumb [items]="breadcrumbs()" class="mb-4" />
  }

  <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4">
    <!-- Title & Description -->
    <div class="flex-1 min-w-0">
      <h1 class="text-2xl font-bold text-neutral-900 dark:text-neutral-100 truncate">
        {{ title() }}
      </h1>

      @if (description()) {
        <p class="mt-1 text-sm text-neutral-500 dark:text-neutral-400">
          {{ description() }}
        </p>
      }
    </div>

    <!-- Actions -->
    @if (hasActions()) {
      <div class="flex flex-wrap items-center gap-2 shrink-0">
        @for (action of actions(); track $index) {
          <button
            type="button"
            class="btn"
            [class]="getActionClass(action.variant || 'primary')"
            [disabled]="action.disabled || action.loading"
            (click)="onActionClick(action)"
          >
            @if (action.loading) {
              <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
              </svg>
            } @else if (action.icon) {
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path [attr.d]="action.icon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
              </svg>
            }
            {{ action.label }}
          </button>
        }
      </div>
    }
  </div>
</div>
