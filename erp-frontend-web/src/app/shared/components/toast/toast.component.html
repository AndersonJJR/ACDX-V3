@if (isVisible()) {
  <div
    class="flex items-start gap-3 p-4 rounded-xl border shadow-soft animate-slide-in-right"
    [class]="getBgClass()"
    role="alert"
    aria-live="polite"
    aria-atomic="true"
  >
    <!-- Ícone -->
    <div class="flex-shrink-0 mt-0.5" [class]="getIconClass()">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path [attr.d]="getIcon()" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
      </svg>
    </div>

    <!-- Conteúdo -->
    <div class="flex-1 min-w-0">
      <div class="flex items-start justify-between gap-2">
        <div>
          <h4 class="text-sm font-semibold text-neutral-900 dark:text-neutral-100">
            {{ toast().title }}
          </h4>
          @if (toast().message) {
            <p class="mt-1 text-sm text-neutral-600 dark:text-neutral-400">
              {{ toast().message }}
            </p>
          }
        </div>

        <!-- Botão de ação opcional -->
        @if (toast().action) {
          <button
            type="button"
            class="flex-shrink-0 text-sm font-medium px-3 py-1 rounded-lg transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2"
            [class]="getActionButtonClass()"
            (click)="executeAction()"
          >
            {{ toast().action!.label }}
          </button>
        }

        <!-- Botão fechar -->
        @if (toast().closable) {
          <button
            type="button"
            class="flex-shrink-0 p-1 rounded-lg text-neutral-400 hover:text-neutral-600 hover:bg-neutral-100 dark:hover:bg-neutral-800 dark:hover:text-neutral-200 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2"
            [class]="getCloseButtonRingClass()"
            (click)="dismiss()"
            aria-label="Fechar notificação"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        }
      </div>
    </div>

    <!-- Barra de progresso -->
    @if (toast().duration && toast().duration > 0) {
      <div class="absolute bottom-0 left-0 h-1 rounded-b-xl transition-all duration-100 ease-linear" [style.width.%]="progress()" [class]="getProgressClass()"></div>
    }
  </div>
}
