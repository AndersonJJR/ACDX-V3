<div class="card overflow-hidden">
  <div class="overflow-x-auto">
    <table class="w-full" role="grid">
      <thead class="bg-neutral-50 dark:bg-neutral-800/50">
        <tr class="border-b border-neutral-200 dark:border-neutral-700">
          <th *ngFor="let column of config().columns"
              [style]="getHeaderStyle(column)"
              class="px-4 py-3 text-left text-xs font-semibold text-neutral-600 dark:text-neutral-400 uppercase tracking-wider whitespace-nowrap">
            <span>{{ column.label }}</span>
          </th>
        </tr>
      </thead>

      <tbody class="divide-y divide-neutral-200 dark:divide-neutral-700">
        <tr *ngIf="config().loading">
          <td [attr.colspan]="config().columns.length" class="px-4 py-12 text-center">
            <div class="flex items-center justify-center gap-3 text-neutral-500 dark:text-neutral-400">
              <svg class="animate-spin h-6 w-6" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
              </svg>
              <span>Carregando...</span>
            </div>
          </td>
        </tr>

        <tr *ngIf="!config().loading && config().data.length === 0">
          <td [attr.colspan]="config().columns.length" class="px-4 py-12 text-center text-neutral-500 dark:text-neutral-400">
            {{ config().emptyMessage || 'Nenhum registro encontrado' }}
          </td>
        </tr>

        <tr *ngFor="let row of config().data; trackBy: trackByFn; let rowIndex = index"
            [class]="getRowClasses(row)"
            [style]="getRowStyles(row)"
            (click)="onRowClick(row, $event)"
            class="cursor-pointer hover:bg-neutral-50 dark:hover:bg-neutral-800/50 transition-colors"
            role="row">
          <ng-container *ngFor="let cell of getCellValues(row); track cell.column.key">
            <td [style]="getCellStyle(cell.column)"
                class="px-4 py-3 text-sm text-neutral-900 dark:text-neutral-100 whitespace-nowrap"
                role="gridcell">
              {{ cell.value }}
            </td>
          </ng-container>
        </tr>

        <tr *ngIf="!config().loading && config().data.length === 0">
          <td [attr.colspan]="config().columns.length" class="px-4 py-12 text-center text-neutral-500 dark:text-neutral-400">
            {{ config().emptyMessage || 'Nenhum registro encontrado' }}
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="config().totalItems > config().pageSize" class="card-footer flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
    <div class="flex items-center gap-3 text-sm text-neutral-600 dark:text-neutral-400">
      <span>{{ getPageInfo() }}</span>

      <select class="input input-sm w-auto"
              [value]="config().pageSize"
              (change)="onPageSizeChange($any($event.target).value)"
              aria-label="Itens por página">
        <option *ngFor="let size of config().pageSizeOptions" [value]="size">{{ size }} por página</option>
      </select>
    </div>

    <div class="flex items-center gap-1">
      <button type="button" class="btn btn-ghost btn-sm"
              [disabled]="config().pageIndex === 0"
              (click)="onPageChange({ pageIndex: 0, pageSize: config().pageSize, length: config().totalItems })"
              aria-label="Primeira página">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
        </svg>
      </button>

      <button type="button" class="btn btn-ghost btn-sm"
              [disabled]="config().pageIndex === 0"
              (click)="onPageChange({ pageIndex: config().pageIndex - 1, pageSize: config().pageSize, length: config().totalItems })"
              aria-label="Página anterior">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
      </button>

      <span class="px-3 text-sm font-medium text-neutral-900 dark:text-neutral-100">
        {{ config().pageIndex + 1 }}
      </span>

      <button type="button" class="btn btn-ghost btn-sm"
              [disabled]="(config().pageIndex + 1) * config().pageSize >= config().totalItems"
              (click)="onPageChange({ pageIndex: config().pageIndex + 1, pageSize: config().pageSize, length: config().totalItems })"
              aria-label="Próxima página">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </button>

      <button type="button" class="btn btn-ghost btn-sm"
              [disabled]="(config().pageIndex + 1) * config().pageSize >= config().totalItems"
              (click)="onPageChange({ pageIndex: getLastPageIndex(), pageSize: config().pageSize, length: config().totalItems })"
              aria-label="Última página">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7m-8-14l7 7-7 7" />
        </svg>
      </button>
    </div>
  </div>
