<div class="min-h-screen bg-neutral-50 dark:bg-neutral-950 flex flex-col" [style.--primary-color]="primaryColor()" [style.--secondary-color]="secondaryColor()">
  <!-- Header -->
  <header class="bg-white dark:bg-neutral-900 border-b border-neutral-200 dark:border-neutral-800 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <!-- Logo & Title -->
        <div class="flex items-center gap-4">
          @if (config().showLogo !== false) {
            <a routerLink="/" class="flex items-center gap-3" aria-label="{{ getCompanyName() }} - Início">
              @if (getCompanyLogo()) {
                <img
                  [src]="getCompanyLogo()"
                  [alt]="getCompanyName()"
                  class="h-8 w-auto"
                />
              } @else {
                <div class="w-8 h-8 rounded-lg flex items-center justify-center" [style.background-color]="primaryColor()">
                  <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 32 32">
                    <path d="M16 2L4 8v16l12 6 12-6V8L16 2zm0 2.5L25.5 9 16 13.5 6.5 9 16 4.5zM6 10.5l9 4.5v9H6v-9zm10 0v9h10v-9l-9-4.5z"/>
                  </svg>
                </div>
              }
              <span class="text-xl font-bold text-neutral-900 dark:text-neutral-100">
                {{ getCompanyName() }}
              </span>
            </a>
          }
        </div>

        <!-- User Menu -->
        <div class="flex items-center gap-4">
          <div class="relative">
            <button
              type="button"
              class="flex items-center gap-2 p-1.5 rounded-lg hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500"
              aria-label="Menu do usuário"
            >
              <div class="w-8 h-8 rounded-full bg-primary-100 dark:bg-primary-900/30 flex items-center justify-center">
                @if (user()?.avatar) {
                  <img [src]="user()!.avatar" alt="" class="w-8 h-8 rounded-full" />
                } @else {
                  <span class="text-sm font-medium text-primary-600 dark:text-primary-400">
                    {{ user()?.name?.charAt(0).toUpperCase() || 'U' }}
                  </span>
                }
              </div>
              <span class="hidden sm:block text-sm font-medium text-neutral-700 dark:text-neutral-300">
                {{ user()?.name || 'Usuário' }}
              </span>
              <svg class="w-4 h-4 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </button>

            <div class="absolute right-0 mt-2 w-48 bg-white dark:bg-neutral-900 rounded-xl shadow-soft border border-neutral-200 dark:border-neutral-800 py-2 z-50">
              <div class="px-4 py-3 border-b border-neutral-200 dark:border-neutral-800">
                <p class="text-sm font-medium text-neutral-900 dark:text-neutral-100 truncate">{{ user()?.name }}</p>
                <p class="text-xs text-neutral-500 dark:text-neutral-400 truncate">{{ user()?.email }}</p>
              </div>
              <hr class="my-2 border-neutral-200 dark:border-neutral-800" />
              <button (click)="onLogout()" class="flex items-center gap-2 w-full px-4 py-2 text-sm text-danger-600 hover:bg-danger-50 dark:hover:bg-danger-900/20 text-left">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a2 2 0 012-2h2a2 2 0 012 2v1" /></svg>
                Sair
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="bg-white dark:bg-neutral-900 border-t border-neutral-200 dark:border-neutral-800 py-4">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <p class="text-center text-sm text-neutral-500 dark:text-neutral-400">
        © {{ new Date().getFullYear() }} {{ getCompanyName() }}. Todos os direitos reservados.
      </p>
    </div>
  </footer>

  <!-- Toast Container -->
  <app-toast-container />
</div>
